name: Release image

# Manual only: /deploy starts it (gh workflow run release.yml), then rolls the tag out on the server.
on:
  workflow_dispatch:

# Only the image job may publish: tests and dependency installs run without that right.
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: checks
    # Images come from master only, never from a branch someone dispatched.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Actions are pinned by commit SHA: this job holds packages: write.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The server is x86; building on the runner avoids emulating it on an Apple Silicon laptop.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # One tag per commit and no :latest: the server runs exactly the image a release names.
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # release.sh checks this against the commit it was asked to release.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # Own cache scope: only this job (from master) writes the layers it later reads.
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
      # The digest travels to the server through GitHub, not the registry: release.sh pulls by it,
      # so a tag re-pointed in the registry cannot change what runs (#103).
      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$DIGEST" > image-digest.txt
          echo "Image: \`ghcr.io/${{ github.repository }}:${{ github.sha }}@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 90
