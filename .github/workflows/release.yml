name: Release image

# Manual only: /deploy starts it (gh workflow run release.yml), then rolls the tag out on the server.
on:
  workflow_dispatch:

# Only the image job may publish: tests and dependency installs run without that right.
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: checks
    # Images (and :latest) come from master only, never from a branch someone dispatched.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The server is x86; building on the runner avoids emulating it on an Apple Silicon laptop.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
