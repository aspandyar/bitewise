name: CI

on:
  push:
  pull_request:
  # Reused by release.yml, so an image is only built from a green commit.
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bitewise
          POSTGRES_PASSWORD: bitewise
          POSTGRES_DB: bitewise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bitewise"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://bitewise:bitewise@localhost:5432/bitewise_test
    steps:
      # Actions are pinned by commit SHA: a moved tag cannot swap the code that runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
