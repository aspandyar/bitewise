# Production stack (stage 6b). Lives in /opt/bitewise on the server next to .env (chmod 600).
# Release steps: docker/scripts/release.sh. Runbook: docs/ru/deploy.md.
# Locally: DOCKER=podman COMPOSE_ENV_FILE=.local-prod/app.env docker/scripts/... (ports from that file).

# Own project name: next to the dev compose (project "bitewise") it must never share containers
# or the pgdata volume.
name: bitewise-prod

# Container logs rotate: on a small VPS an unbounded nginx access log eventually fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Every container: a setuid binary cannot raise privileges back (#102).
x-no-new-privileges: &no-new-privileges
  - "no-new-privileges:true"

# Everything that runs the app image: the web process and the release steps.
x-app-container: &app-container
  logging: *logging
  # No default: release.sh names the image as <commit sha>@<digest>, scripts read the live one
  # from .release-tag (#103).
  image: ghcr.io/aspandyar/bitewise:${IMAGE_TAG:?set IMAGE_TAG}
  # release.sh pulls by digest itself; compose never fetches by tag (a missing local image is an
  # error, not a silent pull of whatever the tag points at now).
  pull_policy: never
  # Code and image are immutable at runtime; only the Next cache and /tmp are writable.
  read_only: true
  tmpfs:
    - /tmp
    - /app/.next/cache:mode=1777
  cap_drop: [ALL]
  security_opt: *no-new-privileges
  mem_limit: 512m
  pids_limit: 256

x-app-database-url: &app-database-url postgres://${APP_DB_USER:?set APP_DB_USER}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    logging: *logging
    # Base images are pinned by digest as well: a re-pointed tag on Docker Hub changes nothing.
    # To update: new tag and digest in one commit.
    image: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    security_opt: *no-new-privileges
    # Memory caps size the stack for a 1–2 GB VPS: a leak or flood in one service hits its own
    # limit instead of pushing Postgres into the kernel's OOM killer, and if the host still runs
    # out, the kernel picks another process before the database.
    mem_limit: 512m
    oom_score_adj: -500
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    # No ports: only the app reaches the database, over the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    <<: *app-container
    restart: unless-stopped
    # Only what the web process needs (#102): the admin password reaches bootstrap-admin alone, the
    # Postgres superuser password stays with db and migrate, and the app logs in as its own role (#101).
    environment:
      DATABASE_URL: *app-database-url
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      # Closed unless the owner opens it (#27).
      REGISTRATION: ${REGISTRATION:-closed}
    depends_on:
      db:
        condition: service_healthy
    # No ports: nginx is the only way in, so every request carries the proxy's X-Forwarded-For.

  # Release steps (release.sh runs them with `run --rm`); the same image, each with its own env.
  migrate:
    <<: *app-container
    profiles: ["ops"]
    mem_limit: 256m
    # The only step that runs as the owner: migrations create tables and extensions.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["node", "ops/migrate.js"]

  seed:
    <<: *app-container
    profiles: ["ops"]
    mem_limit: 256m
    environment:
      DATABASE_URL: *app-database-url
    command: ["node", "ops/seed.js"]

  bootstrap-admin:
    <<: *app-container
    profiles: ["ops"]
    mem_limit: 256m
    environment:
      DATABASE_URL: *app-database-url
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    command: ["node", "ops/bootstrap-admin.js"]

  nginx:
    logging: *logging
    image: docker.io/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    security_opt: *no-new-privileges
    # The master process binds 80/443 and drops workers to the nginx user; nothing else is needed.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    mem_limit: 128m
    pids_limit: 64
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      PUBLIC_HOST: ${PUBLIC_HOST:-${DOMAIN}}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
      # The image's entrypoint exports NGINX_LOCAL_RESOLVERS from /etc/resolv.conf (Docker and
      # podman use different DNS addresses), so `app` is resolved per request.
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./docker/nginx:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Picks up renewed certificates: reload every 6 hours alongside the server process.
    command:
      - sh
      - -c
      - 'while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"'

  certbot:
    logging: *logging
    image: docker.io/certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    # Off locally (DOMAIN=localhost uses a self-signed certificate); on the server: --profile tls.
    profiles: ["tls"]
    restart: unless-stopped
    security_opt: *no-new-privileges
    mem_limit: 256m
    pids_limit: 64
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint:
      - sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  letsencrypt:
  certbot-www:
